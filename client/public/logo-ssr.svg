<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3C64D" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D59" />
      <stop offset="100%" stop-color="#081C36" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Badge Emblem Oval -->
  <g transform="translate(10, 15)">
    <!-- Outer gold border -->
    <ellipse cx="50" cy="45" rx="46" ry="42" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)"/>
    <ellipse cx="50" cy="45" rx="40" ry="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2"/>
    
    <!-- SSR Monogram -->
    <text x="50" y="52" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">SSR</text>
    
    <!-- Decorative star under SSR -->
    <text x="50" y="70" font-family="sans-serif" font-size="10" fill="#FFE885" text-anchor="middle">✦ ✦ ✦</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(120, 20)">
    <!-- Main Title -->
    <text x="0" y="40" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#0B2545" letter-spacing="-0.5">
      Sri Sai Ram
    </text>
    <text x="0" y="68" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="url(#goldGrad)" letter-spacing="2">
      CONSULTANCY
    </text>
    <text x="0" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#64748B" letter-spacing="1">
      Your Dreams... Our Guidance...
    </text>
  </g>
</svg>
